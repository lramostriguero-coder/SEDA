signal void triangular(float frecuencia) {
float volts;

  while (1) {          
    volts = 0;
    while (volts < 3.3){
      ain0 = volts;     /* analog input-0 */
      swatch ((1/100*frecuencia));  
      volts += 3.3/50;    
    }
   volts=3.3;
    while (volts >0.0){
      ain0 = volts;
      swatch ((1/100*frecuencia));  
      volts -= 3.3/50;    
    }
  }
}
