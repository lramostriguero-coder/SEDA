signal void send_data (void) {
// Cabecera
	S3IN=0x55;swatch(0.01);
	S3IN=0xAA;swatch(0.01);
	S3IN=0x03;swatch(0.01);
	S3IN=0x08;swatch(0.01);
// Velocidad giro
	S3IN=0x80;swatch(0.01);
	S3IN=0x02;swatch(0.01);
//Angulo inicial
	S3IN=0x00;swatch(0.01);
	S3IN=0x28;swatch(0.01);
	S3IN=0xE8;swatch(0.01);
	S3IN=0x03;swatch(0.01);
	S3IN=0x64;swatch(0.01);
	S3IN=0x4C;swatch(0.01);
	S3IN=0x04;swatch(0.01);
	S3IN=0x60;swatch(0.01);
	S3IN=0xB0;swatch(0.01);
	S3IN=0x04;swatch(0.01);
	S3IN=0x5A;swatch(0.01);
	S3IN=0x14;swatch(0.01);
	S3IN=0x05;swatch(0.01);
	S3IN=0x55;swatch(0.01);
	S3IN=0x78;swatch(0.01);
	S3IN=0x05;swatch(0.01);
	S3IN=0x50;swatch(0.01);
	S3IN=0xDC;swatch(0.01);
	S3IN=0x05;swatch(0.01);
	S3IN=0x4B;swatch(0.01);
	S3IN=0x40;swatch(0.01);
	S3IN=0x06;swatch(0.01);
	S3IN=0x46;swatch(0.01);
	S3IN=0xA4;swatch(0.01);
	S3IN=0x06;swatch(0.01);
	S3IN=0x41;swatch(0.01);
// Ángulo final
	S3IN=0x00;swatch(0.01);
	S3IN=0x2A;swatch(0.01);
// CRC
	S3IN=0xFE;swatch(0.01);
	S3IN=0x64;
}
DEFINE BUTTON "TX TRAMA","send_data()"